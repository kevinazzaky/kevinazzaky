
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Halloween Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kevinazzaky
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#e3d04f&color_dots=#ebedf0,#fac690,#c46213,#984b10,#e3d04f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e3d04f&color_dots=#151b23,#fac690,#c46213,#984b10,#e3d04f

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
